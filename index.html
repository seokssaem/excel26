<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%93%8A%3C/text%3E%3C/svg%3E">
</head>
<body>
<title>공무원 AI 엑셀 실습 가이드</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout concept: 엑셀 통합 문서 한 권. 위는 제목 표시줄과 수식 입력줄(지금 보는 위치), 왼쪽은 탐색 창(Day별 묶음), 아래는 상태 표시줄(진도·글자 크기). 40~60대 수강생 기준 글자 17px, 누르는 곳 44px 이상. */
:root{
  --bg:#F2F5F3; --bg2:#E8EEEA; --surface:#FFFFFF; --ink:#16231C; --muted:#44564C; --line:#D3DDD6; --line-strong:#7A8C81; --grid:#E3EAE5;
  --green:#1D6F42; --on-green:#FFFFFF; --green-soft:#E3F1E8; --green-ink:#0E4A2B;
  --bar:#1D6F42; --bar-ink:#FFFFFF; --bar-muted:#CFE6D8;
  --ai:#94460A; --ai-soft:#FDF0DD; --ai-line:#E9C48A;
  --warn:#B42318; --warn-soft:#FDECEA;
  --code-bg:#0F1D16; --code-ink:#DDF0E3; --code-muted:#85A593; --code-line:#1D3327; --code-control:#2F4A3A; --code-ok:#52C48A;
  --font-body:'IBM Plex Sans KR','Noto Sans KR','Malgun Gothic',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono','D2Coding','Consolas',ui-monospace,monospace;
  --nav-w:272px; --fx-h:48px; --status-h:52px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1511; --bg2:#101A15; --surface:#15211B; --ink:#E5EEE8; --muted:#A9BBB0; --line:#2A3B32; --line-strong:#5F7A6B; --grid:#1B2922;
    --green:#52C48A; --on-green:#0D1511; --green-soft:#17301F; --green-ink:#A6E8C6;
    --bar:#12301F; --bar-ink:#E5EEE8; --bar-muted:#9DC7AE;
    --ai:#F2B35E; --ai-soft:#2D2212; --ai-line:#5C4524;
    --warn:#FF8F82; --warn-soft:#3A1A17;
    --code-bg:#08110C; --code-ink:#DDF0E3; --code-muted:#7C9C8A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1511; --bg2:#101A15; --surface:#15211B; --ink:#E5EEE8; --muted:#A9BBB0; --line:#2A3B32; --line-strong:#5F7A6B; --grid:#1B2922;
  --green:#52C48A; --on-green:#0D1511; --green-soft:#17301F; --green-ink:#A6E8C6;
  --bar:#12301F; --bar-ink:#E5EEE8; --bar-muted:#9DC7AE;
  --ai:#F2B35E; --ai-soft:#2D2212; --ai-line:#5C4524;
  --warn:#FF8F82; --warn-soft:#3A1A17;
  --code-bg:#08110C; --code-ink:#DDF0E3; --code-muted:#7C9C8A;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:calc(var(--fx-h) + 16px)}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.75;word-break:keep-all;overflow-wrap:break-word;padding-bottom:calc(var(--status-h) + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
h1,h2,h3,h4,h5{text-wrap:balance;line-height:1.35;margin:0}
p{margin:0}
code,.mono{font-family:var(--font-mono)}
button{font:inherit}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:3px solid var(--green);outline-offset:2px}

/* ── 제목 표시줄 ── */
.titlebar{background:var(--bar);color:var(--bar-ink)}
.titlebar .gut{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 16px;padding-block:14px}
.titlebar h1{font-size:22px;font-weight:700}
.titlebar .meta{font-size:15px;color:var(--bar-muted)}
.titlebar .file{font-family:var(--font-mono);font-size:14px;color:var(--bar-muted);margin-left:auto}
@media(max-width:700px){.titlebar .file{display:none}}

/* ── 수식 입력줄: 지금 보는 위치 ── */
.fxwrap{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.fxwrap .gut{display:flex;gap:8px;align-items:center;padding-block:8px}
.navtoggle{display:none;appearance:none;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font-size:15px;font-weight:600;min-height:44px;padding:0 14px;border-radius:6px;cursor:pointer;white-space:nowrap}
.fxbar{flex:1 1 auto;display:flex;align-items:stretch;min-width:0;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-family:var(--font-mono);font-size:15px}
.namebox{flex:0 0 auto;min-width:96px;padding:8px 14px;border-right:1px solid var(--line);color:var(--green);font-weight:500;text-align:center;white-space:nowrap}
.fxlabel{flex:0 0 auto;padding:8px 12px;border-right:1px solid var(--line);color:var(--muted);font-style:italic}
.fxtext{flex:1 1 auto;min-width:0;padding:8px 14px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--font-body)}
@media(max-width:600px){.fxlabel{display:none}.namebox{min-width:0}}

/* ── 본문 틀: 탐색 창 + 시트 ── */
.app{display:grid;grid-template-columns:var(--nav-w) minmax(0,1fr);align-items:start}
.navpane{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--fx-h) + 17px);max-height:calc(100vh - var(--fx-h) - var(--status-h) - 17px);overflow-y:auto;scrollbar-width:none;border-right:1px solid var(--line);background:var(--bg2);padding:16px 12px 0 max(12px,env(safe-area-inset-left,0px))}
.navpane::-webkit-scrollbar{display:none}
.navtop{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 10px 8px}
.navpane h2{font-size:14px;font-weight:700;letter-spacing:.04em;color:var(--muted);margin:0}
.navhide{appearance:none;display:inline-flex;align-items:center;gap:4px;min-height:36px;padding:0 10px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font-size:14px;font-weight:600;border-radius:6px;cursor:pointer}
.navhide:hover,.navtoggle:hover{border-color:var(--green);color:var(--green)}
.navhide svg,.navmore svg{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#navlist{padding-bottom:16px}
.navmore{position:sticky;bottom:0;display:flex;align-items:center;justify-content:center;gap:6px;width:calc(100% + 24px);margin:0 -12px;min-height:44px;appearance:none;border:0;border-top:1px solid var(--line-strong);background:var(--bg2);color:var(--green);font-size:15px;font-weight:700;cursor:pointer}
.navmore:hover{background:var(--surface)}
.navmore[hidden]{display:none}
.navmore svg{animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(3px)}}
@media(min-width:901px){
  body.nav-hidden .app{grid-template-columns:minmax(0,1fr)}
  body.nav-hidden .navpane{display:none}
  .navhide{display:none}
  /* 탐색 창 오른쪽 가장자리에 붙은 세로 라벨: 숨기기 / 목차 */
  .navtab{position:fixed;z-index:31;left:calc(var(--nav-w) - 1px);top:calc(env(safe-area-inset-top,0px) + 140px);display:flex;align-items:center;justify-content:center;width:26px;height:52px;padding:0;appearance:none;border:1px solid var(--line-strong);border-left:0;border-radius:0 8px 8px 0;background:var(--bg2);color:var(--ink);font-size:15px;font-weight:700;cursor:pointer}
  .navtab:hover{background:var(--surface);color:var(--green);border-color:var(--green)}
  .navtab svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  body.nav-hidden .navtab{left:0;background:var(--green);border-color:var(--green);color:var(--on-green)}
  body.nav-hidden .navtab svg{transform:rotate(180deg)}
}
@media(max-width:900px){.navtab{display:none}
}
.navgroup{margin-bottom:18px}
.navgroup:last-child{margin-bottom:0}
.navhead{display:flex;flex-direction:column;padding:0 8px 6px;border-bottom:1px solid var(--line);margin-bottom:6px}
.navhead b{font-size:16px}
.navhead span{font-size:14px;color:var(--muted)}
.navitem{display:flex;align-items:center;gap:10px;width:100%;min-height:46px;appearance:none;border:1px solid transparent;background:transparent;color:var(--ink);font-size:16px;font-weight:500;text-align:left;padding:8px 10px;border-radius:6px;cursor:pointer}
.navitem:hover{background:var(--surface);border-color:var(--line)}
.navitem[aria-current="page"]{background:var(--surface);border-color:var(--green);color:var(--green);font-weight:700;box-shadow:inset 4px 0 0 var(--green)}
.navitem .lbl{flex:1 1 auto;min-width:0}
.navitem .cnt{flex:none;font-family:var(--font-mono);font-size:13px;color:var(--muted);font-weight:500}
.navitem .cnt.full{color:var(--green)}
.sheet{min-width:0;padding-block:28px 64px}
.sheet>.inner{max-width:920px;margin:0 auto;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.colhead{display:flex;height:24px;margin:-28px 0 24px;border-bottom:1px solid var(--line);background:var(--bg2);overflow:hidden;font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.colhead i{font-style:normal;flex:0 0 96px;border-right:1px solid var(--grid);text-align:center;line-height:23px}
.colhead i:first-child{flex-basis:40px}
@media(max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .navtoggle{display:inline-flex;align-items:center}
  .navpane{position:fixed;z-index:45;top:0;padding-top:calc(16px + env(safe-area-inset-top,0px));left:0;bottom:calc(var(--status-h) + env(safe-area-inset-bottom,0px));width:min(320px,88vw);max-height:none;border-right:1px solid var(--line-strong);box-shadow:0 0 0 100vmax rgba(0,0,0,.35);transform:translateX(-105%);visibility:hidden;transition:transform .2s,visibility .2s}
  .navpane.open{transform:none;visibility:visible}
  .sheet>.inner{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}
.zoomable{zoom:var(--zoom,1)}

/* ── 상태 표시줄 ── */
.statusbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg2);border-top:1px solid var(--line-strong);padding-bottom:env(safe-area-inset-bottom,0px)}
.statusbar .gut{display:flex;align-items:center;gap:10px 18px;min-height:var(--status-h);font-size:15px}
.statusbar .ready{color:var(--muted);white-space:nowrap}
.statusbar .prog{display:flex;align-items:center;gap:10px;flex:1 1 auto;min-width:0;max-width:420px}
.statusbar .prog .progress{flex:1 1 auto;min-width:60px;margin:0}
.statusbar .prog span{white-space:nowrap;font-weight:600}
.zoom{display:flex;align-items:center;gap:4px;margin-left:auto}
.zoom>span{color:var(--muted);margin-right:4px;white-space:nowrap}
.zoom button{appearance:none;min-width:44px;min-height:40px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font-size:16px;font-weight:700;border-radius:6px;cursor:pointer}
.zoom button:hover{border-color:var(--green);color:var(--green)}
.zoom output{min-width:52px;text-align:center;font-family:var(--font-mono);font-size:15px}
.seg{display:flex;align-items:center;gap:0}
.seg>span{color:var(--muted);margin-right:8px;white-space:nowrap}
.seg button{appearance:none;min-height:40px;padding:0 12px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font-size:15px;font-weight:600;cursor:pointer;margin-left:-1px}
.seg button:first-of-type{border-radius:6px 0 0 6px;margin-left:0}
.seg button:last-of-type{border-radius:0 6px 6px 0}
.seg button[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--on-green);position:relative}
.zoom{margin-left:0}
.statusbar .prog{margin-right:auto}
@media(max-width:1200px){.statusbar .ready,.zoom>span,.seg>span{display:none}}
@media(max-width:760px){.seg.view{display:none}}
@media(max-width:600px){.statusbar .prog .progress{display:none}.statusbar .prog span{font-size:14px;overflow:hidden;text-overflow:ellipsis}.statusbar .gut{gap:8px}.seg button{padding:0 8px}}

/* ── 카드 배치: 실습 카드를 격자로, 펼친 카드와 머리글은 한 줄 전체 ── */
body.view-grid .stack:has(>details.ex){display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;align-items:stretch}
body.view-grid .stack:has(>details.ex)>:not(details.ex){grid-column:1/-1}
/* 카드 배치에서 펼친 카드는 격자를 깨지 않도록 화면 위 창으로 띄운다 */
body.view-grid .ex[open]{position:fixed;z-index:50;top:calc(env(safe-area-inset-top,0px) + 20px);max-height:calc(100vh - var(--status-h) - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - 40px);left:50%;transform:translateX(-50%);width:min(900px,calc(100vw - 32px));overflow-y:auto;overscroll-behavior:contain;border:2px solid var(--green);box-shadow:0 0 0 100vmax rgba(10,20,15,.5)}
body.view-grid .ex[open]>summary{position:sticky;top:0;z-index:1;background:var(--surface)}
body.view-grid .ex[open]>summary::after{content:"닫기 ✕";color:var(--on-green);background:var(--green);border-color:var(--green)}
body.ex-lock{overflow:hidden}
body.view-grid .stack:has(>details.ex)>.btn{justify-self:start}
body.view-grid .ex:not([open])>summary{height:100%;align-content:flex-start;padding:16px}
body.view-grid .ex:not([open]) .etitle{flex:1 1 100%;order:1;font-size:18px}
body.view-grid .ex:not([open])>summary::after{order:4;margin-left:0}
body.view-grid .ex:not([open]):hover{border-color:var(--green)}

/* ── 패널 공통 ── */
.panel[hidden]{display:none}
.lead{font-size:18px;max-width:62ch;margin-bottom:8px}
.sec-title{font-size:26px;font-weight:700;margin:44px 0 8px}
.sec-title:first-child{margin-top:0}
h3.sec-title{font-size:21px;margin-top:32px}
h4.sec-title{font-size:18px;margin-top:24px}
.sec-sub{color:var(--muted);margin-bottom:16px;max-width:66ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:20px 22px}
.card h3{font-size:19px;margin-bottom:4px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media(max-width:1100px){.grid3{grid-template-columns:minmax(0,1fr)}}
@media(max-width:760px){.grid2{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:14px}
.loop{display:flex;flex-direction:column;gap:4px}
.loop .n{align-self:flex-start;font-family:var(--font-mono);font-size:14px;font-weight:500;padding:2px 10px;border:1px solid var(--green);color:var(--green-ink);background:var(--green-soft)}
.loop.ai .n{border-color:var(--ai);background:var(--ai-soft);color:var(--ai)}
.loop h3{margin-top:6px}
.loop p{color:var(--muted);font-size:16px}
.help li{margin:6px 0}
.nb{white-space:nowrap}

/* ── 표 ── */
.tablewrap{overflow-x:auto;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:16px}
th,td{padding:12px 14px;border-bottom:1px solid var(--grid);border-right:1px solid var(--grid);text-align:left;vertical-align:top}
th:last-child,td:last-child{border-right:0}
th{background:var(--green);color:var(--on-green);font-weight:600;font-size:15px;white-space:nowrap;border-right-color:rgba(255,255,255,.18)}
tbody tr:nth-child(even) td{background:var(--bg)}
tr:last-child td{border-bottom:0}
td.t{white-space:nowrap;font-family:var(--font-mono);font-size:15px;color:var(--muted)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}

/* ── 칩·링크·버튼 ── */
.chip{display:inline-block;font-size:14px;font-weight:600;padding:2px 10px;border-radius:999px;border:1px solid var(--line-strong);color:var(--muted);white-space:nowrap;line-height:1.5}
.chip.lv-b{border-color:var(--green);color:var(--green)}
.chip.lv-c{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip.sec{background:var(--grid);border-color:var(--grid)}
.chip.ai2{border-color:var(--ai);color:var(--ai)}
.chip.opt{border-style:dashed}
.chip.per{background:var(--green);border-color:var(--green);color:var(--on-green)}
.chip.file{font-family:var(--font-mono);font-weight:400;font-size:13px;border-radius:0}
.dl{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 14px;background:var(--bg);border:1px solid var(--line)}
.dl b{font-size:15px;color:var(--muted);margin-right:4px}
.dl a,td a.dla{display:inline-flex;align-items:center;min-height:40px;font-size:15px;font-weight:600;padding:6px 14px;border-radius:6px;border:1px solid var(--green);color:var(--green);text-decoration:none;background:var(--surface)}
.dl a.xl,td a.dla.xl{border-style:dashed}
.dl a:hover,td a.dla:hover{background:var(--green);color:var(--on-green)}
td a.dla{margin:2px 4px 2px 0}
.dl .sec-sub{margin:0;font-size:15px}
.tools,.bksum{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin-bottom:14px}
.bksum strong{font-size:17px;margin-right:6px}
.btn{appearance:none;font-size:15px;font-weight:600;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);padding:8px 16px;min-height:44px;border-radius:6px;cursor:pointer}
.btn:hover{border-color:var(--green);color:var(--green)}
.bkfind{font:inherit;font-size:16px;padding:8px 12px;min-height:44px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);color:var(--ink);flex:1 1 240px;min-width:0}
.progress,.bkbar{height:12px;border-radius:999px;background:var(--grid);overflow:hidden;margin:6px 0 4px}
.progress i,.bkbar i{display:block;height:100%;width:0;background:var(--green);transition:width .2s}
.bkbar{margin:0 0 18px}

/* ── 안내 상자: 셀 메모 ── */
.note{position:relative;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 18px 12px 16px;font-size:16px}
.note::after{content:"";position:absolute;top:-1px;right:-1px;border-style:solid;border-width:0 14px 14px 0;border-color:transparent var(--green) transparent transparent}
.note::before{content:"메모";display:block;flex-basis:100%;font-size:14px;font-weight:700;color:var(--green-ink);margin-bottom:2px}
.note.warn{background:var(--warn-soft)}
.note.warn::after{border-right-color:var(--warn)}
.note.warn::before{content:"주의";color:var(--warn)}
.note.ai{background:var(--ai-soft)}
.note.ai::after{border-right-color:var(--ai)}
.note.ai::before{content:"다음 단계";color:var(--ai)}

/* ── 교시 머리 ── */
.daybar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin:30px 0 10px;padding-bottom:8px;border-bottom:2px solid var(--ink)}
.daybar:first-child{margin-top:0}
.daybar h2{font-size:22px}
.daybar h3{font-size:20px}
.daybar span:not(.chip){color:var(--muted);font-size:15px;font-family:var(--font-mono)}
.stack>.daybar{margin:22px 0 0}
.stack>.daybar+.btn{align-self:flex-start}

/* ── 실습 카드 ── */
.ex{background:var(--surface);border:1px solid var(--line-strong);border-radius:8px}
.ex>summary{list-style:none;cursor:pointer;padding:14px 18px;min-height:64px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.ex>summary::-webkit-details-marker{display:none}

 f:[{l:'L2: 공백이 많아도 두 번째 단어를 뽑음)',c:'=TRIM(MID(SUBSTITUTE(TRIM(E2)," ",REPT(" ",50)),51,50))'},{l:'검증: 구 종류 수 (6이어야 함)',c:'=COUNTA(UNIQUE(L2:L81))'}],
 ai:{t:'수식 요청',p:'엑셀 E열에 "대구광역시 수성구 범어동 123-4" 형태의 주소가 있어. 일부는 앞에 공백이나 연속 공백이 있어.\n두 번째 단어("구")만 L열에 뽑는 수식을 엑셀 2021에서 되는 방법으로 알려줘. 수식이 어떻게 동작하는지 한 줄씩 설명도 붙여줘.',k:['받은 수식에 TEXTSPLIT처럼 엑셀 2021에 없는 함수가 있으면 틀린 것입니다.','UNIQUE 검증에서 6개 외의 값이 나오면 공백 처리가 덜 된 행을 찾아봅니다.']},
 ai2:{t:'남이 만든 수식 해설받기 (AI 프로젝트 10)',p:'다음 엑셀 수식을 엑셀을 처음 쓰는 공무원에게 설명하듯이 한 줄씩 풀어줘.\n=TRIM(MID(SUBSTITUTE(TRIM(E2)," ",REPT(" ",50)),51,50))\n마지막에 "이 수식이 깨지는 경우"를 2가지 알려줘.'},
 ans:'구 6종: 수성구, 달서구, 북구, 중구, 동구, 서구'},

{id:'D1-5',day:1,per:'6',lv:'기본',sec:'1장 Section 02',file:'D1_Complaints_prep',title:'부서명과 처리상태 표기 통일',
 story:'담당부서가 "도로과", "도로 과", "도로과 "처럼 공백 때문에 다른 값으로 취급됩니다. 이대로 피벗을 만들면 같은 부서가 여러 줄로 쪼개집니다.',
 steps:['M열에 부서명, N열에 처리상태를 정리하는 수식을 넣습니다.','정리 전 F열과 정리 후 M열의 종류 수를 비교합니다.','M열로 피벗을 만들어 부서별 건수를 정답 확인 탭과 대조합니다. 이 단계의 표는 80행 기준입니다.','마무리: 지금까지 정리한 파일을 "중복제거72.xlsx"로 다른 이름 저장하고, 접수번호 열 기준으로 [중복된 항목 제거]를 해서 72행으로 만듭니다. 이 파일이 2일차 시작 파일입니다.'],
 f:[{l:'M2: 부서명의 모든 공백 제거',c:'=SUBSTITUTE(F2," ","")'},{l:'N2: 앞뒤 공백 제거',c:'=TRIM(H2)'},{l:'종류 수 비교',c:'=COUNTA(UNIQUE(F2:F81))\n=COUNTA(UNIQUE(M2:M81))'}],
 ai:{t:'표기 매핑표를 AI에게 만들게 하기',p:'아래는 표기가 제각각인 부서명 목록이야(가상 데이터).\n표준 부서명 6개(도로과, 환경위생과, 복지정책과, 건축과, 교통행정과, 민원봉사과)에 맞춰 "원래 표기 | 표준 표기" 2열 표로 만들어줘.\n확신이 없는 항목은 억지로 맞추지 말고 "확인필요"라고 적어줘.\n[여기에 F열 값을 붙여넣기]',k:['"확인필요"가 나온 항목을 사람이 직접 판단합니다. AI가 억지로 맞춘 항목이 없는지 봅니다.','정리 후 종류가 정확히 6개인지 확인합니다.']},
 ans:'정리 후 부서 6종. 80행 기준: 교통행정과 16, 도로과 10, 건축과 15, 민원봉사과 16, 복지정책과 15, 환경위생과 8(합계 80). 중복제거72로 만든 뒤: 14, 7, 14, 14, 15, 8(합계 72).'},

{id:'D1-6',day:1,per:'6',lv:'기본',sec:'3장 Section 07',file:'D2_Pivot_prep · 원본 복사 시트',title:'입력 오류 막기: 데이터 유효성 3종',
 story:'이 연습은 2일차 오후에도 쓰는 D2_Pivot_prep 파일에서 하되, 원본 시트를 복사한 시트에서 연습합니다. 정리는 사후 처리이고, 유효성은 사전 예방입니다. 입력 단계에서 막으면 정리할 일이 줄어듭니다.',
 steps:['처리상태 열: [데이터] → [데이터 유효성 검사] → 목록 → "완료,처리중,이관".','접수번호 열: 사용자 지정 → 중복 입력 금지 수식.','접수일 열: 날짜 → 2026-07-01 ~ 2026-09-30 사이만 허용.','오류 메시지 탭에서 "허용되지 않는 값입니다. 목록에서 선택하세요"처럼 고칠 방법이 보이게 씁니다.','일부러 틀린 값을 입력해 막히는지 확인합니다.'],
 f:[{l:'접수번호 중복 금지 (사용자 지정, A2 기준)',c:'=COUNTIF($A:$A,A2)=1'}],
 ai:{t:'오류 메시지 문구 다듬기',p:'엑셀 데이터 유효성 검사에서 처리상태 열에 "완료, 처리중, 이관" 외의 값을 입력하면 뜨는 오류 메시지를 써줘.\n제목은 10자 이내, 내용은 두 문장 이내로, 어떻게 고치면 되는지가 들어가게 공무원 업무 톤으로 3가지 안을 줘.',k:['메시지에 "오류"라는 말만 있고 해결 방법이 없는 안은 버립니다.']},
 ans:'목록에 없는 값을 넣으면 경고 창이 뜨고 입력이 취소됩니다.'},

{id:'D1-7',day:1,per:'7',lv:'도전',sec:'AI 프로젝트 03 응용',file:'D1_Complaints_prep',title:'민원 내용을 AI로 분류하고 사람이 검수하기',
 story:'민원 내용 열(G)의 글을 읽고 유형별로 나누는 일은 AI가 잘하는 작업입니다. 대신 AI의 분류를 그대로 믿지 않고, 담당부서 열과 대조해 틀린 곳을 찾습니다. 실습에서는 가상 민원 15건만 사용합니다.',
 steps:['G2:G16의 민원 내용 15건을 복사합니다. 실제 업무에서는 이름, 연락처, 주소가 섞이지 않게 먼저 지워야 합니다.','아래 프롬프트와 함께 AI에 붙여넣고 표를 받습니다.','결과 표를 엑셀 새 시트에 붙여넣고, 담당부서와 대조해 일치/불일치를 표시합니다.','불일치 건을 사람이 판단합니다. AI가 틀렸는지, 부서 배정이 애매한 건인지 토론합니다.','"일치율"을 숫자 하나로 정리해 말해 봅니다.'],
 f:[{l:'일치율 계산 예시 (분류가 R열, 기준 유형이 S열이라면)',c:'=SUMPRODUCT(--(R2:R16=S2:S16))/ROWS(R2:R16)'}],
 ai:{t:'분류 + 근거 + 확신 없음 표시',p:'아래는 가상의 민원 제목 15건이야.\n각 건을 [도로·교통 / 생활환경 / 복지 / 건축·주택 / 행정서비스] 중 하나로 분류하고, 분류한 근거를 5글자 이내로 적어줘.\n표 형식(번호 | 민원 제목 | 분류 | 근거)으로 출력하고, 애매하면 억지로 고르지 말고 "확인필요"라고 적어줘.\n[여기에 민원 제목 붙여넣기]',k:['"확인필요"를 얼마나 썼는지 봅니다. 한 건도 없다면 오히려 의심합니다.','분류 기준(유형 5개)을 내가 정해 준 대로 지켰는지, 새 유형을 만들지 않았는지 확인합니다.']},
 ans:'정답 없는 토론형 과제입니다. 일치율과 불일치 사례를 발표용 한 줄로 정리합니다.'},

{id:'D2-1',day:2,per:'1',lv:'기본',sec:'1장 Section 03',file:'D1_Complaints_done',title:'처리기한(14일) 넘긴 민원 찾아 빨갛게 칠하기',
 story:'1일차에 만든 중복제거72 파일을 열고, O·P열 수식을 추가합니다(1일차에는 J~N열까지 만들었습니다). 파일이 없으면 (완성) 파일의 수식 열을 그대로 사용합니다. (완성) 파일은 중복이 남은 80행이라 기한초과 24건·지연처리 22건이 나옵니다. 중복제거72 파일에서 O·P열을 만들었다면 21건·20건입니다. 오늘은 수식을 새로 짜기보다 이 열 위에 서식을 입히는 데 집중하고, 수식의 원리는 3일차 함수 시간에 설명합니다. 처리 완료된 건은 걸린 날수, 처리 중인 건은 오늘까지 지난 날수를 구해 14일을 넘으면 표시합니다. 기준일은 설정 시트 B2에 고정되어 있습니다.',
 steps:['O열: 완료일이 있으면 완료일−접수일, 없으면 기준일−접수일.','P열: 14일을 넘으면, 처리 중이면 "기한초과", 이미 끝났으면 "지연처리".','데이터 범위(중복제거72는 A2:P73, 완성 파일 80건은 A2:P81)에 조건부 서식 → 새 규칙 → "수식을 사용하여 서식을 지정할 셀 결정"으로 행 전체를 칠합니다. 표 만들기는 다음 실습(D2-2)에서 합니다.','설정 시트 B2를 =TODAY()로 바꾸면 건수가 어떻게 달라지는지 확인하고 이유를 말해 봅니다.','중복 제거를 하기 전과 후의 건수를 비교합니다.'],
 f:[{l:'O2: 경과(처리) 일수',c:'=IF(I2="",설정!$B$2-J2,I2-J2)'},{l:'P2: 기한 초과 구분',c:'=IF(O2>14,IF(N2="처리중","기한초과","지연처리"),"")'},{l:'조건부 서식 수식 (적용 범위: 중복제거72는 A2:P73, 완성 파일은 A2:P81)',c:'=$P2="기한초과"'},{l:'건수 확인 (72건 파일이면 P2:P73)',c:'=COUNTIF(P2:P81,"기한초과")'}],
 ai:{t:'조건부 서식 규칙 만들기',p:'엑셀 내 데이터 범위(72건 파일은 A2:P73, 80건 파일은 A2:P81)에서 P열이 "기한초과"인 행 전체를 연한 빨간색으로 칠하는 조건부 서식 규칙을 만들어줘.\n사용할 수식과 메뉴 경로를 단계별로 알려줘.',k:['수식이 =$P2="기한초과" 처럼 열만 고정($P)이고 행은 고정하지 않았는지 확인합니다. =$P$2 로 쓰면 첫 행만 기준이 됩니다.','"적용 대상" 범위가 내 데이터 끝 행까지(중복제거72는 A2:P73, 완성 파일은 A2:P81)인지 확인합니다.']},
 ans:'중복 제거 후: 기한초과 21건, 지연처리 20건 (제거 전에는 24건, 22건)'},

{id:'D2-2',day:2,per:'2',lv:'기본',sec:'1장 Section 03',file:'D1_Complaints_done',title:'표로 바꾸고 슬라이서로 클릭 필터',
 story:'1일차에 만든 중복제거72 파일(없으면 (완성) 파일)로 합니다. 정제 열을 쓰므로 표로 바꿀 때 J~P열이 함께 들어가는지 확인합니다. 자주 걸러 보는 목록은 필터를 매번 여는 대신, 클릭 한 번으로 걸러지는 슬라이서를 붙입니다.',
 steps:['데이터 안을 클릭하고 Ctrl+T로 표를 만듭니다.','[테이블 디자인]에서 표 이름을 t민원으로 바꿉니다.','[테이블 디자인] → [슬라이서 삽입] → 담당부서, 정제_상태를 고릅니다.','"도로과 + 처리중"을 눌러 건수를 확인하고, 슬라이서 열 수를 3으로 조정해 모양을 정리합니다.'],
 f:[],aiNote:'이 과제는 AI에게 시키는 것보다 마우스로 하는 쪽이 빠릅니다. "AI를 쓰지 않는 게 나은 작업"을 구분하는 연습으로 삼습니다.',
 ans:'슬라이서를 모두 해제하면 처음 건수로 돌아옵니다. 내 파일(중복제거72)이면 72건, (완성) 파일이면 80건입니다.'},

{id:'D2-3',day:2,per:'3',lv:'기본',sec:'1장 Section 03 복습',file:'D3_Budget_done',title:'집행률에 데이터 막대와 색 기준 적용',
 story:'예산집행 파일은 3일차 함수 시간에 수식을 직접 만드는 파일입니다. 오늘은 (완성) 파일의 집행률·등급 열에 서식만 입힙니다. 숫자표를 보고서에 쓸 때는 눈에 띄게 만듭니다. 집행률 열에 막대를 넣고 등급 열을 색으로 구분합니다.',
 steps:['F열(집행률) 선택 → [홈] → [조건부 서식] → [데이터 막대].','J열 선택 → [조건부 서식] → [셀 강조 규칙] → [같음] → "부진"은 연한 빨강, "우수"는 연한 초록.','F열에 "70보다 작음" 규칙을 추가해 글자를 빨간색으로 합니다.'],
 f:[],
 ai:{t:'규칙 설정법 묻기',p:'엑셀에서 F열 숫자에 데이터 막대를 넣고, 70 미만인 셀의 글자만 빨간색으로 바꾸는 조건부 서식 설정 방법을 메뉴 경로까지 단계별로 알려줘. 엑셀 한국어 버전 기준으로.',k:['AI가 말한 메뉴 이름이 내 화면의 메뉴와 같은지 확인합니다. 영어 메뉴명을 직역해 알려주는 경우가 있습니다.']},
 ans:'부진 등급 행이 붉게 보이고, 예산없음 행은 표시되지 않으면 정상'},

{id:'D2-4',day:2,per:'4',lv:'기본',sec:'3장 Section 07 · AI 프로젝트 07',file:'D2_Pivot_prep',title:'조건과 OR 조건으로 필요한 행만 뽑기',
 story:'"건축·주택 민원 중 처리에 14일이 넘게 걸린 건" 같은 목록을 필요할 때마다 뽑습니다.',
 steps:['원본 시트에서 자동 필터로 민원유형=건축·주택, 처리일수>14를 걸어 건수를 확인합니다.','FILTER 수식으로 같은 목록을 다른 시트에 펼칩니다.','"또는" 조건(건축·주택이거나 처리중)은 곱셈(*) 대신 덧셈(+)을 씁니다.','FILTER 대신 [데이터] → [고급]으로 조건 범위를 지정해 추출하는 방법도 비교해 봅니다.'],
 f:[{l:'AND 조건',c:'=FILTER(원본!A2:G421,(원본!C2:C421="건축·주택")*(원본!F2:F421>14),"없음")'},{l:'OR 조건',c:'=FILTER(원본!A2:G421,(원본!C2:C421="건축·주택")+(원본!E2:E421="처리중")>0,"없음")'}],
 ai:{t:'AND/OR 구분해서 요청',p:'"원본" 시트 A2:G421에 접수번호, 접수일, 민원유형, 담당부서, 처리상태, 처리일수, 만족도가 있어.\n(1) 민원유형이 "건축·주택"이고 처리일수가 14보다 큰 행, (2) 민원유형이 "건축·주택"이거나 처리상태가 "처리중"인 행을 각각 다른 시트에 펼치는 방법을 알려줘.\n엑셀 2021 기준으로 FILTER 방법과 고급 필터 방법 모두.',k:['(1)은 21건, (2)는 82건이 나와야 합니다.','OR을 AND로 잘못 쓰면 건수가 확 줄어듭니다. 건수로 바로 알 수 있습니다.']},
 ans:'AND 조건 21건 · OR 조건 82건 (건축·주택 전체 45건)'},

{id:'D2-7',day:2,per:'7',lv:'기본',sec:'3장 Section 09',file:'D2_Monthly (폴더)',title:'월별 파일 3개를 파워 쿼리로 한 번에 합치기',
 story:'매달 파일이 따로 오면 복사해서 붙이는 일이 반복됩니다. 폴더 안의 파일을 한꺼번에 읽어 합치도록 한 번만 설정하면, 다음 달 파일을 폴더에 넣고 새로 고침만 누르면 됩니다.',
 steps:['내려받은 D2_Monthly.zip을 마우스 오른쪽 단추로 눌러 [모두 압축 풀기]를 합니다. 압축을 풀면 D2_Monthly 폴더가 만들어지고, 그 안에 월별 파일 3개(Complaints_07~09)가 들어 있습니다.','새 통합 문서를 만들고 [데이터] → [데이터 가져오기] → [파일에서] → [폴더에서]를 선택합니다.','압축을 푼 D2_Monthly 폴더(월별 파일 3개가 바로 보이는 폴더)를 고르고 [데이터 결합] → [데이터 결합 및 변환]을 누릅니다.','샘플 파일 선택 창에서 표 t민원(또는 시트 민원처리)을 고르고 확인합니다.','파워 쿼리 편집기에서 접수일이 날짜 형식인지 확인하고 [닫기 및 로드]를 누릅니다.','행 수가 420(130+140+150)인지 확인합니다.','실험: 9월 파일을 복사해 이름을 "민원처리현황_10월.xlsx"로 바꿔 폴더에 넣고, [데이터] → [모두 새로 고침]을 눌러 행 수가 늘어나는지 봅니다.','엑셀에서 폴더 안의 파일을 열어 둔 상태면 "~$"로 시작하는 임시 파일이 생겨 오류의 원인이 됩니다. 합치기 전에 파일을 닫습니다.'],
 f:[],
 ai:{t:'파워 쿼리 오류 읽기',p:'엑셀 파워 쿼리에서 폴더의 엑셀 파일을 합치는 중인데 아래 오류가 났어.\n[오류 메시지를 여기에 붙여넣기]\n가능한 원인을 확률이 높은 순서로 3가지 알려주고, 각각 어디를 어떻게 확인하면 되는지 순서대로 알려줘. 개인정보가 포함된 값은 쓰지 마.',k:['원인이 "~$ 임시 파일", "열 이름이 다른 파일", "시트/표 이름이 다른 파일" 중 어디에 해당하는지 하나씩 소거해 봅니다.']},
 ans:'합친 결과 420행'},

{id:'D2-5',day:2,per:'5',lv:'기본',sec:'3장 Section 08',file:'D2_Pivot_prep',title:'피벗: 월 × 유형, 슬라이서, 피벗 차트',
 story:'월별·유형별 접수 건수 표는 피벗테이블의 가장 기본이고 가장 많이 쓰는 형태입니다.',
 steps:['원본 표 안을 클릭하고 [삽입] → [피벗 테이블] → 새 워크시트.','행: 민원유형, 열: 접수일, 값: 접수번호(개수). 접수일은 월 단위로 묶습니다. (자동으로 안 묶이면 날짜 셀 우클릭 → 그룹 → 월)','필터에 처리상태를 올리고, [피벗 테이블 분석] → [슬라이서]로 담당부서, 처리상태를 추가합니다.','[피벗 차트]를 삽입하고 슬라이서를 누르며 표와 차트가 함께 바뀌는지 봅니다.','합계를 정답 확인 탭과 대조합니다.'],
 f:[],
 ai:{t:'피벗 구성 막혔을 때',p:'엑셀 피벗테이블에서 날짜 열을 열 영역에 올렸는데 월로 묶이지 않고 날짜별로 모두 펼쳐져. 내 엑셀은 한국어 2021이야.\n월 단위로 묶는 방법을 메뉴 경로로 알려주고, 묶기 메뉴가 회색으로 비활성화되는 대표적인 원인 2가지도 알려줘.',k:['원인 중 "날짜 열에 글자나 빈칸이 섞여 있음"을 내 데이터에서 확인합니다. (이 파일은 깨끗합니다)']},
 ans:'총 420건. 도로·교통 132 / 생활환경 117 / 복지 79 / 건축·주택 45 / 행정서비스 47'},

{id:'D2-6',day:2,per:'6',lv:'도전',sec:'3장 Section 08',file:'D2_Pivot_prep',title:'피벗 값 설정: 평균 처리일수와 비율',
 story:'같은 피벗도 "개수" 대신 "평균", "합계" 대신 "열 합계 비율"로 보면 다른 질문에 답합니다.',
 steps:['값 영역에 처리일수를 추가하고 [값 필드 설정]에서 "평균"으로 바꿉니다.','표시 형식을 소수 첫째 자리로 바꿉니다.','접수번호(개수)를 다시 넣고 [값 표시 형식] → [열 합계 비율]로 바꿔 유형별 비중을 봅니다.','평균 처리일수가 가장 긴 유형은 무엇이고, 이유를 데이터에서 찾을 수 있는지 이야기해 봅니다.'],
 f:[],aiNote:'AI에게 "왜 건축·주택이 오래 걸리나요?"를 묻지 않습니다. 데이터에 없는 원인을 AI가 그럴듯하게 지어내기 때문입니다. 데이터로 말할 수 있는 것과 없는 것을 구분하는 연습입니다.',
 ans:'평균 처리일수: 도로·교통 9.3 / 생활환경 9.7 / 복지 10.4 / 건축·주택 14.2 / 행정서비스 9.1 / 전체 10.1'},

{id:'D3-1',day:3,per:'1-2',lv:'기본',sec:'3장 Section 10',file:'D2_Pivot_done',title:'건수 막대 + 완료율 꺾은선 콤보 차트',
 story:'(완성) 파일의 요약 시트에는 예시 차트가 이미 들어 있습니다. 시트를 복사해 두고 그 차트를 지운 뒤 직접 만들어 봅니다. 단위가 다른 두 지표(건수, 비율)를 한 차트에 넣으려면 보조 축이 필요합니다.',
 steps:['요약 시트에서 민원유형, 합계, 완료율 열을 선택합니다.','[삽입] → [추천 차트] 또는 [콤보 차트]에서 합계는 막대, 완료율은 꺾은선(보조 축)으로 지정합니다.','차트 제목을 셀과 연결해(=요약!$A$1) 제목이 자동으로 바뀌게 합니다.','도전: 완료율 옆에 스파크라인을 넣어 월별 추이를 작게 보여 줍니다.'],
 f:[],aiNote:'차트 서식은 AI에게 글로 설명하기보다 직접 만지는 편이 빠릅니다. 대신 "이 차트가 보고서에 어울리는지" 검토 의견을 AI에게 받아 볼 수 있습니다.',
 ans:'막대와 꺾은선의 축 눈금 단위가 서로 다르게 보이면 정상입니다.'},

{id:'D3-2',day:3,per:'3',lv:'도전',sec:'AI 프로젝트 08',file:'D2_Pivot_done · 요약 시트',title:'요약표로 보고 문장 쓰고, 숫자 검증하기',
 story:'요약표를 AI에게 주고 보고용 문장을 쓰게 합니다. 핵심은 문장을 얻는 것이 아니라, AI가 쓴 숫자와 해석이 표와 맞는지 확인하는 것입니다.',
 steps:['요약 시트의 표(가상 데이터)를 복사해 프롬프트와 함께 AI에 붙입니다.','AI가 쓴 문장 속 모든 숫자에 형광펜을 칠하고, 표와 하나씩 대조합니다.','"~때문에"처럼 원인을 단정한 문장을 찾아, 표에서 근거가 되는지 확인합니다.','근거가 없는 문장은 "추정" 표시를 달거나 삭제합니다.'],
 f:[],
 ai:{t:'표의 숫자만 쓰게 하기',p:'아래는 2026년 3분기(7~9월) 민원 유형별 접수 건수와 처리 현황 표(가상 데이터)야.\n이 표에 있는 숫자만 사용해서 (1) 핵심 시사점 3줄, (2) 다음 분기 중점 관리 항목 2개를 보고서 문체로 써줘.\n표에 없는 원인이나 배경은 단정하지 말고 "추정"이라고 표시해줘.\n[여기에 요약표 붙여넣기]',k:['문장 속 숫자가 표와 모두 일치하는지 확인합니다.','"추정" 표시 없이 원인을 단정한 문장이 있는지 확인합니다.','표에 없는 숫자(전년 대비 등)를 AI가 새로 만들어 넣지 않았는지 확인합니다.']},
 ans:'합계 420건, 완료율 78.3%, 평균 처리일수 10.1일, 평균 만족도 3.79 — 이 숫자가 AI 문장과 일치해야 합니다.'},

{id:'D3-3',day:3,per:'4',lv:'기본',sec:'2장 Section 04 · AI 프로젝트 05',file:'D3_HR_prep',title:'기준일을 한 곳에 고정하고 이름으로 부르기',
 story:'보고서 숫자는 "언제 기준인가"에 따라 달라집니다. 기준일을 셀 하나에 두고 모든 수식이 그 셀을 보게 하면, 날짜만 바꿔 전체를 다시 계산할 수 있습니다.',
 steps:['설정 시트 B2에 기준일(2026-10-31)이 들어 있는 것을 확인합니다.','B2를 선택하고 이름 상자에 "기준일"을 입력해 이름을 정의합니다. ([수식] → [이름 정의]로도 가능)','다른 시트 수식에서 설정!$B$2 대신 기준일이라고 써 봅니다.','B2를 =TODAY()로 바꿨다 되돌려 보고, 보고서에는 어느 쪽을 쓰는 게 좋은지 이야기합니다.'],
 f:[{l:'이름을 정의한 뒤',c:'=DATEDIF(E2,기준일,"y")'},{l:'이름을 쓰지 않았을 때 (절대참조)',c:'=DATEDIF(E2,설정!$B$2,"y")'}],
 ai:{t:'TODAY()와 고정 날짜 전환 구조 묻기',p:'엑셀 보고서에서 기준일을 별도 셀에 두고, 평소에는 TODAY()를 쓰다가 제출용으로는 고정 날짜로 바꾸고 싶어.\n구조를 어떻게 만들면 좋은지 단계별로 알려주고, TODAY()를 그대로 쓸 때의 위험도 2가지 알려줘.',k:['AI가 말한 위험(열 때마다 값이 바뀜, 제출본이 나중에 달라짐)을 실제로 B2를 바꿔서 재현해 봅니다.']},
 ans:'이름 정의 후에도 계산 결과는 설정!$B$2를 쓸 때와 같아야 합니다.'},

{id:'D3-4',day:3,per:'4',lv:'기본',sec:'2장 Section 05',file:'D3_HR_prep',title:'근속연수와 근속개월 계산 (DATEDIF)',
 story:'임용일에서 기준일까지의 기간을 구합니다. DATEDIF는 함수 목록에 뜨지 않는 함수라 직접 외우기 어렵지만, AI에게 물으면 형식을 바로 알려줍니다.',
 steps:['직원 시트 F열에 근속연수, G열에 근속개월을 넣습니다.','시작일과 끝일 순서를 바꿔 보고 어떤 오류가 나는지 봅니다.','G001(이은지, 2024-01-04 임용)의 값을 정답 확인 탭과 대조합니다.'],
 f:[{l:'F2: 근속연수',c:'=DATEDIF(E2,기준일,"y")'},{l:'G2: 근속개월',c:'=DATEDIF(E2,기준일,"m")'}],
 ai:{t:'DATEDIF 형식 묻기',p:'엑셀 DATEDIF 함수의 사용법을 알려줘.\n세 번째 인수 "y", "m", "d", "ym", "md"가 각각 무엇을 계산하는지 표로 정리하고, 시작일과 끝일을 거꾸로 넣으면 어떤 오류가 나는지도 알려줘.',k:['AI가 알려준 오류(#NUM!)를 실제로 재현해 맞는지 확인합니다.']},
 ans:'G001 이은지: 근속연수 2, 근속개월 33'},

{id:'D3-5',day:3,per:'4',lv:'기본',sec:'2장 Section 06',file:'D3_HR_prep',title:'근속 구간으로 연가 일수 찾기',
 story:'근속개월이 6 이상이면 4일, 12 이상이면 6일처럼 "이상" 구간으로 일수가 정해집니다. 정확히 같은 값을 찾는 게 아니라 "넘지 않는 가장 큰 기준"을 찾는 조회입니다. 기준표는 수업용 가상 값입니다.',
 steps:['연가기준표 시트의 A열(근속개월 이상)이 오름차순인지 확인합니다.','H열에 아래 수식을 넣습니다.','경계값 테스트: G2를 12, 11, 71, 72로 바꿔 보며 6, 4, 17, 21이 나오는지 확인하고 원래 수식으로 되돌립니다.','XLOOKUP 대신 LOOKUP, VLOOKUP 수식으로도 같은 결과가 나오는지 비교합니다.'],
 f:[{l:'H2: XLOOKUP (일치 모드 -1 = 작거나 같은 값 중 가장 가까운 것)',c:'=XLOOKUP(G2,연가기준표!$A$2:$A$9,연가기준표!$B$2:$B$9,0,-1)'},{l:'H2: LOOKUP 방식',c:'=LOOKUP(G2,연가기준표!$A$2:$A$9,연가기준표!$B$2:$B$9)'},{l:'H2: VLOOKUP 방식 (마지막 인수 TRUE)',c:'=VLOOKUP(G2,연가기준표!$A$2:$B$9,2,TRUE)'}],
 ai:{t:'구간 조회 수식 요청',p:'연가기준표 시트에서 A열은 근속개월(이상), B열은 연가일수야. A2:A9, B2:B9에 들어 있고 오름차순이야.\n직원 시트 G열의 근속개월로 H열에 연가일수를 찾아오는 수식을 만들어줘. 정확히 일치하는 값이 없을 때는 바로 아래 구간의 값을 가져와야 해.\n엑셀 2021 기준으로 XLOOKUP과 LOOKUP 두 가지로 알려줘.',k:['경계값(12개월, 71개월 등)을 직접 넣어 봅니다. 구간 조회는 경계에서 틀리기 쉽습니다.','연가 일수 같은 규정 값은 AI가 알려줘도 반드시 소속 기관의 복무 규정 원문으로 확인합니다.']},
 ans:'G001 이은지(33개월)의 연가일수 9일, 사용 6일, 잔여 3일'},

{id:'D3-6',day:3,per:'5',lv:'기본',sec:'2장 Section 05 · AI 프로젝트 06',file:'D3_Budget_prep',title:'부서별 예산·집행 집계 (SUMIFS)',
 story:'96행짜리 예산 집행 내역에서 부서별 연간 예산, 집행액, 집행률, 분기별 집행액을 한 번에 만듭니다. 혼합 참조($A4, H$3)를 익히는 좋은 연습입니다.',
 steps:['분석 시트 C열에 부서별 예산 합계, D열에 집행액 합계를 SUMIFS로 넣습니다.','E열에 집행률을 넣습니다.','H4:K11에 분기별 집행액을 한 수식으로 채웁니다. 한 번 입력한 수식을 오른쪽, 아래로 끌어도 맞아야 합니다.','합계 행을 정답과 대조합니다.'],
 f:[{l:'C4: 연간 예산',c:'=SUMIFS(예산집행!$C:$C,예산집행!$A:$A,$A4)'},{l:'D4: 연간 집행액',c:'=SUMIFS(예산집행!$D:$D,예산집행!$A:$A,$A4)'},{l:'E4: 집행률(%)',c:'=IFERROR(ROUND(D4/C4*100,1),0)'},{l:'H4: 분기별 집행액 (혼합 참조)',c:'=SUMIFS(예산집행!$D:$D,예산집행!$A:$A,$A4,예산집행!$E:$E,H$3)'}],
 ai:{t:'시트 구조를 알려 주고 SUMIFS 요청',p:'엑셀 "예산집행" 시트에 A열=부서코드, B열=사업명, C열=예산액(천원), D열=집행액(천원), E열=분기("1분기"~"4분기")가 있어.\n"분석" 시트 A4:A11에는 부서코드가 있고, H3:K3에는 "1분기"~"4분기" 제목이 있어.\nC열에는 부서별 예산 합계, H4:K11에는 부서별·분기별 집행액을 구하는 수식을 만들어줘. H4 하나만 써서 오른쪽, 아래로 끌어 채울 수 있게 $ 기호를 정확히 써줘.',k:['H4를 끌어서 K11까지 채웠을 때 값이 이상하게 같거나 0이 되는 칸이 없는지 봅니다. $ 위치 문제입니다.','합계 행이 3,095,600 / 2,475,500 / 80.0% 인지 확인합니다.']},
 ans:'전체 예산 3,095,600 · 집행 2,475,500 · 집행률 80.0%'},

{id:'D3-7',day:3,per:'5',lv:'기본',sec:'3장 Section 08',file:'D2_Pivot_prep',title:'피벗 결과를 COUNTIFS로 다시 계산해 대조하기',
 story:'피벗이 맞는지는 다른 방법으로 한 번 더 계산해 보면 압니다. 요약 시트에 피벗 없이 같은 표를 만들어 값이 같은지 확인합니다.',
 steps:['요약 시트 B4:D8에 월별·유형별 건수를 COUNTIFS로 넣습니다.','E열 합계, F열 완료율, G열 평균 처리일수, H열 평균 만족도를 채웁니다.','피벗과 값이 다르면, 어느 쪽이 틀렸는지 원인을 찾습니다. (날짜 경계, 필터가 걸린 상태, 새로 고침 누락 등)','피벗의 한 셀을 =로 클릭하면 GETPIVOTDATA 수식이 자동으로 만들어집니다. 직접 쓰기보다 이렇게 만드는 것이 안전합니다.'],
 f:[{l:'B4: 7월 건수 (8월, 9월은 월만 바꿈)',c:'=COUNTIFS(원본!$C:$C,$A4,원본!$B:$B,">="&DATE(2026,7,1),원본!$B:$B,"<"&DATE(2026,8,1))'},{l:'F4: 완료율',c:'=IFERROR(COUNTIFS(원본!$C:$C,$A4,원본!$E:$E,"완료")/E4,0)'},{l:'G4: 평균 처리일수',c:'=IFERROR(AVERAGEIFS(원본!$F:$F,원본!$C:$C,$A4),0)'}],
 ai:{t:'날짜 범위 COUNTIFS 요청',p:'"원본" 시트 B열은 접수일(날짜), C열은 민원유형이야. "요약" 시트 A4에 민원유형이 있고, B3, C3, D3에는 7월, 8월, 9월 제목이 글자로 들어 있어.\n7월 접수 건수를 구하는 COUNTIFS 수식을 만들어줘. 날짜 범위는 월초 이상, 다음 달 1일 미만으로 해줘.',k:['"<=월말"로 쓴 수식은 시간이 들어간 날짜에서 마지막 날이 빠질 수 있습니다. 다음 달 1일 미만 방식이 안전합니다.']},
 ans:'요약 시트 합계 행: 130 / 140 / 150 / 420, 전체 완료율 78.3%'},

{id:'D3-8',day:3,per:'6',lv:'기본',sec:'2장 Section 05',file:'D3_Budget_prep',title:'집행률·등급과 "예산 0" 행 처리 (IFERROR, IFS)',
 story:'예산액이 0인 행이 2개 섞여 있습니다. 그대로 나누면 #DIV/0!가 나고, IFERROR로 0을 돌려주면 이번에는 "부진"으로 잘못 분류됩니다. 오류를 가리는 것과 해결하는 것은 다릅니다.',
 steps:['F열: 집행률 = 집행액 ÷ 예산액 × 100. 처음에는 IFERROR 없이 넣어 #DIV/0!를 확인합니다.','IFERROR로 감쌌을 때 어떤 행이 어떻게 보이는지 확인합니다.','J열 등급: 예산이 0이면 "예산없음", 아니면 90 이상 우수 / 70 이상 보통 / 그 미만 부진.','"예산없음"이 2건인지 세어 봅니다.'],
 f:[{l:'F2: 집행률(%)',c:'=IFERROR(ROUND(D2/C2*100,1),0)'},{l:'G2: 미집행액',c:'=C2-D2'},{l:'J2: 등급',c:'=IF(C2=0,"예산없음",IFS(F2>=90,"우수",F2>=70,"보통",TRUE,"부진"))'},{l:'확인',c:'=COUNTIF(J2:J97,"예산없음")'}],
 ai:{t:'예외 행까지 지시하기',p:'엑셀 "예산집행" 시트에서 C열은 예산액, D열은 집행액이야. 예산액이 0인 행도 있어.\nF열에는 집행률(%)을 소수점 한 자리로, J열에는 등급을 넣고 싶어. 예산액이 0이면 등급에 "예산없음"이라고 쓰고, 아니면 집행률이 90 이상 "우수", 70 이상 "보통", 그 미만 "부진"으로 해줘.\n엑셀 2021 기준으로, 수식마다 한 줄 설명을 붙여줘.',k:['예산 0인 행(2건)이 "부진"으로 분류되지 않았는지 확인합니다. AI가 예외를 빠뜨리기 쉬운 지점입니다.','집행률이 정확히 70, 90인 행이 어느 등급으로 가는지 부등호(>=)를 확인합니다.']},
 ans:'예산없음 2건 · 등급 "부진" 행은 집행률 70 미만이면서 예산이 있는 행'},

{id:'D3-9',day:3,per:'6',lv:'기본',sec:'2장 Section 05',file:'D3_Budget_prep',title:'부서코드로 부서명·팀장 가져오기 (XLOOKUP)',
 story:'집행 내역에는 부서코드(D01 등)만 있습니다. 코드표에서 부서명과 팀장을 가져옵니다. XLOOKUP은 Excel 2021부터 쓸 수 있고, 같은 결과를 INDEX+MATCH로도 만들 수 있습니다.',
 steps:['H열에 부서명, I열에 팀장을 가져옵니다.','부서코드표에서 D05를 지워 "미등록"이 표시되는지 확인한 뒤 복구합니다.','도전: 부서명과 팀장 두 열을 수식 하나로 한꺼번에 가져옵니다.'],
 f:[{l:'H2: 부서명 (XLOOKUP)',c:'=XLOOKUP(A2,부서코드표!$A$2:$A$9,부서코드표!$B$2:$B$9,"미등록")'},{l:'H2: 부서명 (INDEX+MATCH)',c:'=IFERROR(INDEX(부서코드표!$B$2:$B$9,MATCH(A2,부서코드표!$A$2:$A$9,0)),"미등록")'},{l:'도전: 부서명+팀장 동시에',c:'=XLOOKUP(A2,부서코드표!$A$2:$A$9,부서코드표!$B$2:$C$9,"미등록")'}],
 ai:{t:'VLOOKUP 대신 쓸 수식 요청',p:'"예산집행" 시트 A열의 부서코드(D01~D08)로 "부서코드표" 시트 A2:C9에서 부서명(B열)과 팀장(C열)을 찾아 H열, I열에 넣고 싶어.\n찾지 못하면 "미등록"이라고 표시해줘. 엑셀 2021 기준으로 XLOOKUP 수식과 INDEX+MATCH 수식을 각각 알려줘.',k:['"미등록"이 0건이어야 합니다.','VLOOKUP을 줬다면 마지막 인수가 FALSE(또는 0)인지 확인합니다. 빠지면 엉뚱한 값을 가져올 수 있습니다.']},
 ans:'COUNTIF(H2:H97,"미등록") = 0'},

{id:'D3-10',day:3,per:'7',lv:'도전',sec:'AI 활용 검증',file:'D3_Budget_prep · D3_HR_prep',title:'AI가 만든 틀린 수식 4개 고치기',type:'bugs',
 story:'AI가 준 수식이 항상 맞는 것은 아닙니다. 아래 수식은 실제로 AI가 내놓기 쉬운 실수를 일부러 심은 것입니다. 파일에 넣어 결과를 확인하고, 어디가 틀렸는지 찾아 고쳐 보세요. 답은 접어 두었습니다.',
 bugs:[
  {q:'=SUMIFS(예산집행!D2:D97,예산집행!A2:A97,"D01",예산집행!E2:E90,"3분기")',why:'합계 범위와 조건 범위의 크기가 다릅니다(97행 vs 90행). #VALUE! 오류가 납니다.',fix:'=SUMIFS(예산집행!D2:D97,예산집행!A2:A97,"D01",예산집행!E2:E97,"3분기")'},
  {q:'=XLOOKUP(F2,연가기준표!$A$2:$A$9,연가기준표!$B$2:$B$9,0,-1)  (직원 시트 H2)',why:'오류 없이 틀린 값이 나옵니다. 기준표는 "개월" 기준인데 근속연수(F열)를 넣었습니다. 5년을 5개월로 읽어 3일이 나옵니다.',fix:'=XLOOKUP(G2,연가기준표!$A$2:$A$9,연가기준표!$B$2:$B$9,0,-1)'},
  {q:'=DATEDIF(설정!$B$2,E2,"y")  (직원 시트 F2)',why:'시작일과 끝일이 거꾸로입니다. #NUM! 오류가 납니다.',fix:'=DATEDIF(E2,설정!$B$2,"y")'},
  {q:'F2: =D2/C2*100   그리고   =AVERAGE(F2:F97)',why:'예산 0인 행에서 #DIV/0!가 나고, 그 오류가 평균까지 번져 평균도 오류가 됩니다.',fix:'F열에 IFERROR를 쓰고, 평균은 예산이 있는 행만 대상으로: =AVERAGEIFS(F2:F97,C2:C97,">0")'}
 ]},

{id:'S3-1',day:3,per:'opt',opt:true,lv:'기본',sec:'2장 Section 05',file:'D3_HR_prep',title:'잔여일수·소진율·사용 안내 대상 표시',
 story:'연가를 많이 남긴 직원에게 사용을 안내해야 합니다. 수업에서는 "잔여 10일 이상"을 안내 대상으로 가정합니다.',
 steps:['J열 잔여일수, K열 소진율을 넣습니다. 연가가 0일인 경우를 대비해 IFERROR를 씁니다.','L열에 잔여 0이면 "소진", 10일 이상이면 "사용 안내"를 표시합니다.','부서별현황 시트에서 부서별 인원, 평균 소진율, 잔여일수 합계, 안내대상 인원을 COUNTIF, AVERAGEIFS, SUMIFS, COUNTIFS로 채웁니다.'],
 f:[{l:'J2: 잔여일수',c:'=H2-I2'},{l:'K2: 소진율',c:'=IFERROR(I2/H2,0)'},{l:'L2: 안내 구분',c:'=IF(J2=0,"소진",IF(J2>=10,"사용 안내",""))'},{l:'부서별현황 C2: 인원',c:'=COUNTIF(직원!$C:$C,A2)'},{l:'부서별현황 D2: 평균 소진율',c:'=IFERROR(AVERAGEIFS(직원!$K:$K,직원!$C:$C,A2),0)'}],
 ai:{t:'조건 판정 수식 요청',p:'직원 시트에서 H열은 연가일수, I열은 사용일수, J열은 잔여일수야.\nL열에 다음 규칙으로 표시하는 수식을 만들어줘: 잔여일수가 0이면 "소진", 10 이상이면 "사용 안내", 그 외는 빈 칸.\n엑셀 2021 기준으로 해줘.',k:['잔여가 정확히 10, 9, 0인 행에서 결과가 맞는지 확인합니다.']},
 ans:'사용 안내 대상 18명'},

{id:'S3-2',day:3,per:'opt',opt:true,lv:'도전',sec:'2장 Section 05',file:'D3_HR_prep',title:'시간외근무: 자정을 넘긴 퇴근 시간 처리',
 story:'시간은 하루가 1입니다. 퇴근이 출근보다 작은(자정을 넘긴) 행은 단순 뺄셈이 음수가 됩니다. 시간외근무 시트 22행에 퇴근이 01:30인 행을 일부러 넣어 두었습니다.',
 steps:['F열을 먼저 =(E2-D2)*24 로 계산해 22행이 음수가 되는 것을 확인합니다.','자정 넘김을 보정한 수식으로 바꿉니다. 점심 1시간은 제외합니다.','G열: 8시간을 넘는 부분만 시간외로 계산합니다.','부서별현황 I열에서 사번별 시간외 합계를 SUMIFS로 구합니다.'],
 f:[{l:'F2: 근무시간(시간 단위, 점심 1h 제외)',c:'=ROUND((E2-D2+(E2<D2))*24-1,2)'},{l:'G2: 시간외',c:'=MAX(0,F2-8)'},{l:'부서별현황 I2: 사번별 시간외 합계',c:'=SUMIFS(시간외근무!$G:$G,시간외근무!$B:$B,H2)'}],
 ai:{t:'음수 시간 문제 해결 요청',p:'엑셀에서 D열은 출근 시각, E열은 퇴근 시각이야. 퇴근이 자정을 넘기면(예: 출근 8:50, 퇴근 1:30) (E-D)*24가 음수가 나와.\n점심 1시간을 뺀 근무시간(시간 단위, 소수 둘째 자리 반올림)을 구하는 수식을 만들어줘. 왜 음수가 나오는지도 한 줄로 설명해줘.',k:['22행의 근무시간이 15.67, 시간외가 7.67이 나오는지 확인합니다.','퇴근이 출근과 같은 시각인 극단 경우(0시간 vs 24시간)는 이 수식이 어떻게 처리하는지 토론해 봅니다.']},
 ans:'G004 신서윤 10/9 (8:50 → 다음날 1:30): 근무 15.67h, 시간외 7.67h / 사번별 합계는 정답표 참고'},

{id:'S3-3',day:3,per:'opt',opt:true,lv:'도전',sec:'2장 Section 05',file:'D3_Budget_prep',title:'부진 사업 건수와 목록 뽑기 (COUNTIFS, FILTER)',
 story:'집행률 70% 미만인 행이 부서별로 몇 건인지 세고, 그 목록을 별도 칸에 자동으로 펼칩니다. 예산이 0인 행은 제외합니다.',
 steps:['분석 시트 F열에 부서별 부진 행 수를 COUNTIFS로 넣고 합계를 냅니다.','분석 시트 빈 곳(예: A30)에 FILTER로 부진 행 목록을 펼칩니다.','목록의 행 수가 부진 행 수 합계와 같은지 확인합니다.','비교를 위해 자동 필터의 "집행률 < 70" 필터로 같은 목록을 만들어 봅니다.'],
 f:[{l:'F4: 부서별 부진 행 수',c:'=COUNTIFS(예산집행!$A:$A,$A4,예산집행!$C:$C,">0",예산집행!$F:$F,"<70")'},{l:'A30: 부진 목록을 집행률 낮은 순으로',c:'=SORT(FILTER(예산집행!A2:J97,(예산집행!F2:F97<70)*(예산집행!C2:C97>0),"없음"),6,1)'},{l:'목록 행 수 확인',c:'=ROWS(A30#)'}],

/* ───────── 렌더 ───────── */
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
function add(p,...c){c.forEach(x=>{if(x)p.appendChild(x)});return p}
async function copyText(text,btn,label){
  const ok=()=>{const o=btn.textContent;btn.textContent='복사됨';btn.classList.add('done');setTimeout(()=>{btn.textContent=label||'복사';btn.classList.remove('done')},1500)};
  try{await navigator.clipboard.writeText(text);ok();return}catch(e){}
  try{const ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;opacity:0;top:0;left:0';document.body.appendChild(ta);ta.select();const r=document.execCommand('copy');ta.remove();if(r){ok();return}}catch(e){}
  btn.textContent='직접 선택해 복사';
}
function copyBtn(getText,cls){const b=el('button',cls||'copy','복사');b.type='button';b.addEventListener('click',()=>copyText(typeof getText==='function'?getText():getText,b));return b}
function fileHref(n){return BASE+n+XL}
function monthFiles(){return [['D2_Monthly.zip (7·8·9월 파일)',BASE+'D2_Monthly.zip']]}
function filesFor(file){
  const out=[];
  if(/VBA코드모음/.test(file)){out.push(['VBA코드모음.txt','VBA코드모음.txt']);return out}
  file.split(/\s*·\s*/).forEach(tok=>{
    const m=tok.trim().match(/^(D\d_[A-Za-z]+?)(?:_(prep|done))?(?:\s*\(폴더\))?$/);
    if(!m)return;
    if(m[1]==='D2_Monthly'){monthFiles().forEach(x=>out.push(x));return}
    const kind=m[2]||'prep';const nm=m[1]+'_'+kind;
    out.push([nm,fileHref(nm)]);
  });
  return out;
}
/* 엑셀은 주소의 한글(%XX)을 풀지 못하고, 259자를 넘는 경로도 거부한다. 영문·짧은 경로일 때만 열기 버튼을 단다 */
function xlUrl(h){return 'ms-excel:ofe|u|'+new URL(h,location.href).href}
function canXl(h){const u=xlUrl(h);return /\.xlsx$/.test(h)&&u.indexOf('%')<0&&u.length<=255}
function pathTooLong(){return !canXl(fileHref('D1_Complaints_prep'))}
function xlLink(label,href){const a=el('a','','엑셀로 열기');a.href='ms-excel:ofe|u|'+new URL(href,location.href).href;a.className='xl';return a}
function dlLink(label,href){const a=el('a','',label);a.href=href;a.setAttribute('download','');return a}
function table(head,rows,opts){
  opts=opts||{};const w=el('div','tablewrap'),t=el('table'),th=el('thead'),tr=el('tr');
  head.forEach((h,i)=>{const c=el('th',(opts.num&&opts.num.includes(i))?'num':'',h);tr.appendChild(c)});th.appendChild(tr);t.appendChild(th);
  const tb=el('tbody');rows.forEach(r=>{const x=el('tr');r.forEach((v,i)=>{const isL=Array.isArray(v);const c=el('td',(opts.num&&opts.num.includes(i))?'num':(opts.time&&i===0?'t':''),isL?'':(typeof v==='number'?v.toLocaleString('ko-KR'):v));if(isL){if(LOCAL)v.forEach(p=>{const a=dlLink(p[0],p[1]);a.className='dla';c.appendChild(a);if(canXl(p[1])){const x=xlLink('열기',p[1]);x.textContent='열기';x.className='dla xl';c.appendChild(x)}});else c.textContent=v.map(p=>p[0]).join(' / ')}x.appendChild(c)});tb.appendChild(x)});
  t.appendChild(tb);w.appendChild(t);return w;
}
function formulaBox(f){
  const box=el('div','fm'),h=el('div','fh');h.appendChild(el('span','',f.l));h.appendChild(copyBtn(f.c));
  const pre=el('pre');pre.textContent=f.c;return add(box,h,pre);
}
function aiBox(ai,title){
  const b=el('div','aib'),h=el('div','ah');h.appendChild(el('strong','','AI에게 물어보기 · '+ai.t));h.appendChild(copyBtn(ai.p));
  const pre=el('pre');pre.textContent=ai.p;add(b,h,pre);
  if(ai.n){const nt=el('p','sec-sub',ai.n);nt.style.margin='8px 0 0';nt.style.fontSize='13px';b.appendChild(nt)}

  const body=el('div','ebody');const fl=LOCAL?filesFor(ex.file):[];if(fl.length){const r=el('div','dl');r.appendChild(el('b','','실습 파일'));fl.forEach(f=>{r.appendChild(dlLink(f[0],f[1]));if(canXl(f[1]))r.appendChild(xlLink('열기',f[1]))});if(pathTooLong()&&fl.some(f=>/\.xlsx$/.test(f[1])))r.appendChild(el('span','sec-sub','엑셀로 열기는 폴더 경로에 한글이 있거나 길어서 숨겨졌습니다. 폴더를 C:\\excel 같은 영문 짧은 경로로 옮기면 나타납니다.'));body.appendChild(r)}body.appendChild(el('p','story',ex.story));
  if(ex.steps){const w=el('div');w.appendChild(el('h4','','직접 해 보기'));const ol=el('ol','steps');ex.steps.forEach(x=>ol.appendChild(el('li','',x)));w.appendChild(ol);body.appendChild(w)}
  if(ex.f&&ex.f.length){const w=el('div','stack');w.appendChild(el('h4','','수식 (복사해서 엑셀에 붙여 넣기)'));ex.f.forEach(f=>w.appendChild(formulaBox(f)));body.appendChild(w)}
  if(ex.type==='bugs'){

function watchCards(){
  if(!('IntersectionObserver' in window))return;
  const seen=new Set();
  const pick=()=>{let best=null,bt=1e9;seen.forEach(d=>{if(d.closest('.panel').hidden||d.hidden)return;const tp=Math.abs(d.getBoundingClientRect().top);if(tp<bt){bt=tp;best=d}});
    if(best){const t=TABS.find(x=>x.id===curTab);setFx(t.box.split('!')[0]+'!'+best.dataset.box,best.querySelector('.etitle').textContent)}else tabFx()};
  const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting)seen.add(e.target);else seen.delete(e.target)});pick()},{rootMargin:'-120px 0px -55% 0px'});
  document.querySelectorAll('details.ex[data-box]').forEach(d=>io.observe(d));
